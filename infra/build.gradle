plugins {
  id ('java')
  id ('java-library')
}

repositories {
  mavenCentral()
}

dependencies {
  implementation project (":common")

  implementation platform ("software.amazon.awssdk:bom:2.40.10")

  implementation ("software.amazon.awssdk:sqs:2.34.0")
  implementation ("software.amazon.awssdk:dynamodb:2.34.0")
  implementation ("software.amazon.awssdk:s3:2.34.0")

  implementation ("com.fasterxml.jackson.core:jackson-databind:2.17.2")
  implementation ("com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2")

  compileOnly ("org.projectlombok:lombok:1.18.42")
  annotationProcessor ("org.projectlombok:lombok:1.18.42")

  testImplementation testFixtures(project(":common"))
  testImplementation ("org.junit.jupiter:junit-jupiter:5.10.2")
  testCompileOnly ("org.projectlombok:lombok:1.18.42")
  testAnnotationProcessor ("org.projectlombok:lombok:1.18.42")
}

test {
  useJUnitPlatform()
}
